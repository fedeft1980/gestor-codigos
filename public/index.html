<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FT_STORE | Obtener código de acceso</title>
<style>
  :root{
    --bg:#0a0a0a;
    --card:#151515;
    --red:#e50914;
    --text:#f5f5f1;
    --muted:#9a9a9a;
    --green:#2ecc71;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100vh;
    font-family:'Segoe UI', Arial, sans-serif;
    background:#0a0a0a;
    color:var(--text);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
    overflow-x:hidden;
    position:relative;
  }
  #matrix{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    z-index:0;
    opacity:.35;
  }
  .card{
    position:relative;
    z-index:1;
    width:100%;
    max-width:420px;
    background:rgba(21,21,21,.92);
    backdrop-filter:blur(2px);
    border:1px solid #262626;
    border-radius:16px;
    padding:28px 28px 32px;
    box-shadow:0 12px 40px rgba(0,0,0,.6);
  }
  .logo{
    display:block;
    width:120px;
    margin:0 auto 12px;
    border-radius:50%;
  }
  h1{
    text-align:center;
    font-size:20px;
    letter-spacing:1px;
    margin:0 0 4px;
    color:var(--text);
  }
  .subtitulo{
    text-align:center;
    font-size:13px;
    color:var(--muted);
    margin:0 0 24px;
  }
  form{margin-top:8px;}
  label{
    font-size:13px;
    color:var(--muted);
    display:block;
    margin-bottom:6px;
  }
  input[type="email"]{
    width:100%;
    padding:12px 14px;
    border-radius:8px;
    border:1px solid #333;
    background:#1f1f1f;
    color:var(--text);
    font-size:15px;
    margin-bottom:16px;
  }
  input[type="email"]:focus{
    outline:none;
    border-color:var(--red);
  }
  button{
    width:100%;
    padding:13px;
    border:none;
    border-radius:8px;
    background:var(--red);
    color:#fff;
    font-size:15px;
    font-weight:700;
    letter-spacing:.3px;
    cursor:pointer;
    transition:background .2s, opacity .2s;
  }
  button:hover{background:#f6121d;}
  button:disabled{opacity:.6;cursor:not-allowed;}

  .result-container{
    display:none;
    margin-top:22px;
  }
  .result-container.active{
    display:block;
  }
  .hora{
    font-size:12.5px;
    color:var(--muted);
    margin-bottom:10px;
  }
  .hora strong{color:var(--text);}
  .leyenda{
    font-size:14px;
    padding:12px 14px;
    border-radius:8px;
    margin-bottom:12px;
    background:rgba(46,204,113,.12);
    border:1px solid var(--green);
    color:var(--green);
  }
  .success{
    font-size:14px;
    font-weight:700;
    color:var(--green);
    margin:0 0 4px;
  }
  .warning-box{
    background:rgba(229,9,20,.12);
    border:1px solid var(--red);
    color:#ff6b6b;
    padding:12px 14px;
    border-radius:8px;
    font-size:14px;
  }
  .error{
    color:#ff6b6b;
    font-size:14px;
  }
  .link-btn{
    display:block;
    text-align:center;
    background:#fff;
    color:#000;
    text-decoration:none;
    padding:12px;
    border-radius:8px;
    font-weight:700;
    margin-top:6px;
  }
  .link-btn:hover{background:#e6e6e6;}

  .whatsapp-btn{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    background:#25D366;
    color:#fff;
    text-decoration:none;
    padding:12px;
    border-radius:8px;
    font-weight:700;
    margin-top:10px;
  }
  .whatsapp-btn:hover{background:#1ebe57;}
  .whatsapp-btn svg{width:18px;height:18px;fill:#fff;}
</style>
</head>
<body>

<canvas id="matrix"></canvas>

<div class="card">
  <img src="logo.jpeg" alt="FT_STORE" class="logo">
  <h1>FT_STORE</h1>
  <p class="subtitulo">Obtené tu enlace de verificación</p>

  <form id="codigoForm">
    <label for="correo">Correo del cliente</label>
    <input type="email" id="correo" name="correo" placeholder="cliente@ejemplo.com" required>
    <button type="submit" id="submitBtn">Obtener Enlace</button>
  </form>

  <div id="resultado" class="result-container"></div>
</div>

<script>
  // Animación de fondo estilo Matrix, liviana (poca densidad, opacidad baja)
  const canvas = document.getElementById('matrix');
  const ctx = canvas.getContext('2d');

  function ajustarTamano() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  }
  ajustarTamano();
  window.addEventListener('resize', ajustarTamano);

  const caracteres = '01';
  const tamanoFuente = 16;
  const espacioColumna = 32; // más ancho = menos columnas = menos "cargado"
  const columnas = Math.floor(canvas.width / espacioColumna);
  const drops = new Array(columnas).fill(0);

  // Cada columna arranca en una posición y velocidad aleatoria para que no sea uniforme
  const velocidades = drops.map(() => 0.3 + Math.random() * 0.5);
  const activo = drops.map(() => Math.random() > 0.5); // solo la mitad de las columnas dibuja, para bajar densidad

  function dibujar() {
    ctx.fillStyle = 'rgba(10,10,10,0.08)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.font = tamanoFuente + 'px monospace';

    for (let i = 0; i < columnas; i++) {
      if (!activo[i]) continue;

      const texto = caracteres[Math.floor(Math.random() * caracteres.length)];
      const x = i * espacioColumna;
      const y = drops[i] * tamanoFuente;

      ctx.fillStyle = 'rgba(0, 220, 90, 0.55)';
      ctx.fillText(texto, x, y);

      if (y > canvas.height && Math.random() > 0.98) {
        drops[i] = 0;
      }
      drops[i] += velocidades[i];
    }
  }

  setInterval(dibujar, 60); // más lento = menos "cargado" visualmente
</script>

<script>
  const form = document.getElementById('codigoForm');
  const correoInput = document.getElementById('correo');
  const submitBtn = document.getElementById('submitBtn');
  const resultadoDiv = document.getElementById('resultado');

  form.addEventListener('submit', async (e) => {
    e.preventDefault();

    const correo = correoInput.value.trim();
    if (!correo) return;

    submitBtn.disabled = true;
    submitBtn.innerText = 'Buscando...';
    resultadoDiv.className = 'result-container active';
    resultadoDiv.innerHTML = '<p>Consultando correo...</p>';

    try {
      const response = await fetch('/api/obtener-codigo', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ correoCliente: correo })
      });

      const data = await response.json();

      // Hora de recepción del correo, si vino en la respuesta
      const horaHtml = data.horaRecepcion
        ? `<div class="hora">Recibido a las <strong>${data.horaRecepcion}</strong></div>`
        : '';

      if (data.correoNoEncontrado) {
        // Caso: No se encontró ningún correo para esa dirección
        const numeroWhatsapp = '5492657219227';
        const mensaje = encodeURIComponent(
          `Hola! No se encontró ningún correo para la dirección: ${correo}`
        );
        const linkWhatsapp = `https://wa.me/${numeroWhatsapp}?text=${mensaje}`;

        resultadoDiv.innerHTML = `
          <div class="warning-box">
            ⚠️ ${data.error || 'No se encontraron correos para este cliente.'}
          </div>
          <a href="${linkWhatsapp}" target="_blank" class="whatsapp-btn">
            <svg viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg"><path d="M16.004 3C9.373 3 4 8.373 4 15.004c0 2.65.87 5.1 2.34 7.09L4.6 28.4l6.47-1.7a11.9 11.9 0 0 0 4.93 1.05h.005c6.63 0 12.004-5.373 12.004-12.004C28.008 8.373 22.635 3 16.004 3zm0 21.79h-.004a9.77 9.77 0 0 1-4.97-1.36l-.356-.21-3.84 1.01 1.03-3.74-.232-.383a9.77 9.77 0 0 1-1.5-5.1c0-5.4 4.396-9.79 9.796-9.79 2.617 0 5.077 1.02 6.93 2.87a9.73 9.73 0 0 1 2.865 6.925c0 5.4-4.394 9.78-9.72 9.78zm5.36-7.33c-.294-.147-1.74-.858-2.01-.956-.27-.098-.467-.147-.664.147-.196.294-.76.955-.933 1.152-.172.196-.343.22-.637.073-.294-.147-1.243-.458-2.367-1.46-.875-.78-1.466-1.744-1.638-2.038-.172-.294-.018-.453.13-.6.133-.132.294-.343.44-.514.147-.172.196-.294.294-.49.098-.196.049-.368-.024-.514-.073-.147-.663-1.6-.91-2.19-.24-.577-.485-.5-.663-.51-.172-.008-.368-.01-.564-.01-.196 0-.514.073-.784.368-.27.294-1.03 1.007-1.03 2.456 0 1.45 1.055 2.85 1.202 3.046.147.196 2.077 3.17 5.032 4.446.703.303 1.252.484 1.68.62.706.225 1.348.193 1.856.117.566-.084 1.74-.71 1.985-1.396.245-.686.245-1.274.172-1.396-.073-.122-.27-.196-.564-.343z"/></svg>
            Avisar por WhatsApp
          </a>
        `;
      } else if (data.vencido || !data.exito) {
        // Caso: Más de 15 minutos, o correo encontrado pero sin enlace
        resultadoDiv.innerHTML = `
          ${horaHtml}
          <div class="warning-box">
            ⚠️ ${data.error || 'ENLACE VENCIDO, REENVÍA'}
          </div>
        `;
      } else {
        // Caso: Correo encontrado y vigente (menos de 15 minutos)
        resultadoDiv.innerHTML = `
          ${horaHtml}
          <div class="leyenda">✅ ${data.leyenda || 'Correo encontrado.'}</div>
          <p class="success">Estado: VÁLIDO</p>
          <a href="${data.enlace}" target="_blank" class="link-btn">🔗 Abrir Enlace de Verificación</a>
        `;
      }
    } catch (err) {
      resultadoDiv.innerHTML = '<p class="error">Error de conexión con el servidor.</p>';
    } finally {
      submitBtn.disabled = false;
      submitBtn.innerText = 'Obtener Enlace';
    }
  });
</script>

</body>
</html>
