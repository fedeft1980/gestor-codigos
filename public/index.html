<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FT_STORE - Gestor de Enlaces</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background-color: #121212;
      color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
      position: relative;
      overflow-x: hidden;
    }

    #matrixFondo {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 0;
      display: block;
      background-color: #0a0a0a;
    }

    .card {
      background-color: #1e1e1e;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
      width: 100%;
      max-width: 420px;
      text-align: center;
      position: relative;
      z-index: 1;
    }

    .hora-recepcion {
      color: #aaa;
      font-size: 0.8rem;
      margin-top: 8px;
    }

    .card-vencido {
      background-color: #2b1a1a;
      border: 1px solid #5a2a2a;
    }

    .mensaje-vencido {
      color: #ff9800;
      font-weight: bold;
      font-size: 1.05rem;
    }

    .btn-reenviar {
      width: 100%;
      background-color: #ff9800;
      color: #000;
      border: none;
      padding: 12px;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 15px;
    }

    .btn-reenviar:hover {
      background-color: #e08800;
    }

    .logo-container {
      margin-bottom: 15px;
    }

    .logo-img {
      width: 110px;
      height: 110px;
      border-radius: 50%;
      object-fit: cover;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
      border: 2px solid #e50914;
    }

    h1 {
      font-size: 1.6rem;
      margin-bottom: 4px;
      color: #ffffff;
      font-weight: bold;
    }

    .sub {
      color: #e50914;
      font-size: 0.85rem;
      font-weight: bold;
      margin-bottom: 15px;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }

    /* Cartel de Aviso Destacado */
    .banner-aviso {
      background: linear-gradient(135deg, #2b1100 0%, #1a1a1a 100%);
      border: 1px solid #ff9800;
      border-left: 5px solid #ff9800;
      border-radius: 10px;
      padding: 14px;
      margin-bottom: 20px;
      text-align: left;
      box-shadow: 0 4px 12px rgba(255, 152, 0, 0.15);
    }

    .banner-titulo {
      color: #ff9800;
      font-weight: bold;
      font-size: 0.95rem;
      margin-bottom: 6px;
      letter-spacing: 0.5px;
    }

    .banner-aviso p {
      color: #e0e0e0;
      font-size: 0.82rem;
      line-height: 1.35;
      margin-bottom: 6px;
    }

    .banner-aviso ul {
      list-style: none;
      padding: 0;
      margin: 6px 0;
    }

    .banner-aviso li {
      font-size: 0.8rem;
      color: #ccc;
      margin-bottom: 4px;
    }

    .banner-pie {
      color: #ffb74d !important;
      font-weight: bold;
      font-size: 0.78rem !important;
      margin-bottom: 0 !important;
      margin-top: 8px;
      text-align: center;
    }

    .form-group {
      margin-bottom: 15px;
      text-align: left;
    }

    label {
      display: block;
      margin-bottom: 5px;
      font-size: 0.9rem;
      color: #ccc;
    }

    input {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #333;
      background-color: #2b2b2b;
      color: #fff;
      font-size: 1rem;
      outline: none;
    }

    input:focus {
      border-color: #e50914;
    }

    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 8px;
      background-color: #e50914;
      color: white;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      margin-top: 10px;
      transition: background-color 0.2s;
    }

    button:hover {
      background-color: #b80710;
    }

    button:disabled {
      opacity: 0.7;
      cursor: not-allowed;
    }

    #resultado {
      margin-top: 20px;
    }

    .card-res {
      padding: 20px;
      border-radius: 10px;
      text-align: center;
    }

    .card-exito {
      background-color: #1a271d;
      border: 1px solid #285430;
    }

    .card-error {
      background-color: #2b2b2b;
      border: 1px solid #444;
    }

    .mensaje-exito {
      color: #4caf50;
      font-weight: bold;
      font-size: 1.1rem;
    }

    .mensaje-error {
      color: #f44336;
      font-weight: bold;
    }

    .btn-enlace-gigante {
      display: block;
      width: 100%;
      padding: 18px 10px;
      margin-top: 15px;
      border-radius: 10px;
      background-color: #25d366;
      color: #000000;
      font-size: 1.05rem;
      font-weight: 900;
      text-decoration: none;
      text-transform: uppercase;
      box-shadow: 0 4px 15px rgba(37, 211, 102, 0.3);
      transition: transform 0.1s, background-color 0.2s;
    }

    .btn-enlace-gigante:active {
      transform: scale(0.98);
    }

    .btn-enlace-gigante:hover {
      background-color: #20ba5a;
    }

    .btn-ws {
      width: 100%;
      background-color: #25d366;
      color: white;
      border: none;
      padding: 12px;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 15px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn-ws:hover {
      background-color: #1da851;
    }

    .btn-ws svg {
      width: 20px;
      height: 20px;
      flex-shrink: 0;
    }

    .texto-ayuda {
      color: #aaa;
      font-size: 0.8rem;
      margin-top: 8px;
    }

    /* Cuadro de Advertencia Especial al Fallar */
    .card-advertencia {
      margin-top: 15px;
      padding: 12px;
      background-color: #332200;
      border: 1px solid #ff9800;
      border-radius: 8px;
      color: #ffcc80;
      font-size: 0.82rem;
      text-align: left;
      line-height: 1.4;
    }

    .card-advertencia-titulo {
      display: flex;
      align-items: center;
      gap: 6px;
      font-weight: bold;
      color: #ff9800;
      margin-bottom: 5px;
      text-transform: uppercase;
      font-size: 0.85rem;
    }
  </style>
</head>

<body>

  <canvas id="matrixFondo"></canvas>

  <div class="card">

    <div class="logo-container">
      <img src="logo.jpeg" alt="FT_STORE Logo" class="logo-img">
    </div>

    <h1>FT_STORE</h1>
    <p class="sub">GESTOR DE ENLACES DE VERIFICACIÓN</p>

    <!-- CARTEL DE AVISO DIRECTIVA -->
    <div class="banner-aviso">
      <div class="banner-titulo">🚨 ATENCIÓN A TODOS</div>
      <p>A partir de hoy, <strong>TODOS los reportes deben hacerse desde la página</strong>.</p>
      <ul>
        <li>⚡ <strong>Prioridad de atención:</strong> Para mensajes desde la web.</li>
        <li>⏳ <strong>Última prioridad:</strong> Fotos directas de la tele ("Hogar").</li>
      </ul>
      <p class="banner-pie">El bot está hecho para ahorrar tiempo. ¡Úsenlo!</p>
    </div>

    <form id="formConsulta">

      <div class="form-group">
        <label for="correoCliente">Correo del Cliente</label>

        <input
          type="email"
          id="correoCliente"
          placeholder="ejemplo@correo.com"
          required
        >
      </div>

      <button type="submit" id="btnBuscar">
        Buscar Enlace
      </button>

    </form>

    <div id="resultado"></div>

  </div>

  <script>

    // ============= FONDO ESTILO MATRIX =============
    (function () {

      const canvas = document.getElementById('matrixFondo');
      const ctx = canvas.getContext('2d');

      let ancho, alto, columnas, gotas, colDatos;

      const CARACTERES = 'アカサタナハマヤラワ0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ';
      const PLATAFORMAS = ['NETFLIX', 'DISNEY+', 'HBOMAX', 'PRIME', 'SPOTIFY', 'YOUTUBE', 'CRUNCHYROLL', 'PARAMOUNT'];
      const TAM_FUENTE = 22;
      const FPS_OBJETIVO = 20;
      const INTERVALO_FRAME = 1000 / FPS_OBJETIVO;
      const SALTO_COLUMNA = 2;
      let ultimoFrame = 0;

      function ajustarTamano() {
        ancho = canvas.width = window.innerWidth;
        alto = canvas.height = window.innerHeight;
        columnas = Math.floor(ancho / TAM_FUENTE / SALTO_COLUMNA);

        gotas = new Array(columnas).fill(0).map(() => Math.floor(Math.random() * -50));
        colDatos = new Array(columnas).fill(null);

        const cantColumnasConNombre = Math.max(1, Math.floor(columnas / 30));
        for (let i = 0; i < cantColumnasConNombre; i++) {
          const col = Math.floor(Math.random() * columnas);
          const palabra = PLATAFORMAS[Math.floor(Math.random() * PLATAFORMAS.length)];
          colDatos[col] = { palabra, offset: 0 };
        }
      }

      function elegirCaracter(col, fila) {
        const info = colDatos[col];
        if (info) {
          const letra = info.palabra[info.offset % info.palabra.length];
          info.offset++;
          return letra;
        }
        return CARACTERES[Math.floor(Math.random() * CARACTERES.length)];
      }

      function dibujar(marcaTiempo) {

        requestAnimationFrame(dibujar);

        if (marcaTiempo - ultimoFrame < INTERVALO_FRAME) {
          return;
        }
        ultimoFrame = marcaTiempo;

        ctx.fillStyle = 'rgba(10, 10, 10, 0.15)';
        ctx.fillRect(0, 0, ancho, alto);

        ctx.font = TAM_FUENTE + 'px monospace';
        ctx.globalAlpha = 0.55;

        for (let i = 0; i < columnas; i++) {

          const esColumnaEspecial = !!colDatos[i];
          ctx.fillStyle = esColumnaEspecial ? '#ff3b3b' : '#00ff41';

          const caracter = elegirCaracter(i, gotas[i]);
          ctx.fillText(caracter, i * TAM_FUENTE * SALTO_COLUMNA, gotas[i] * TAM_FUENTE);

          if (gotas[i] * TAM_FUENTE > alto && Math.random() > 0.98) {
            gotas[i] = 0;

            if (Math.random() > 0.9) {
              const palabra = PLATAFORMAS[Math.floor(Math.random() * PLATAFORMAS.length)];
              colDatos[i] = { palabra, offset: 0 };
            } else {
              colDatos[i] = null;
            }
          }

          gotas[i]++;
        }

        ctx.globalAlpha = 1;
      }

      ajustarTamano();
      window.addEventListener('resize', ajustarTamano);
      requestAnimationFrame(dibujar);

    })();
    // ============= FIN FONDO MATRIX =============

    const TELEFONO_SOPORTE = "5492657219227";

    const form = document.getElementById('formConsulta');
    const btnBuscar = document.getElementById('btnBuscar');
    const contenedorResultado = document.getElementById('resultado');

    form.addEventListener('submit', async (e) => {

      e.preventDefault();

      const correoCliente =
        document.getElementById('correoCliente').value.trim();

      btnBuscar.disabled = true;
      btnBuscar.textContent = 'Buscando...';

      contenedorResultado.style.display = 'block';

      contenedorResultado.innerHTML = `
        <div class="card-res card-exito">
          <p style="color:#ccc;">
            Conectando con la casilla...
          </p>
        </div>
      `;

      try {

        const res = await fetch('/api/obtener-codigo', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            correoCliente
          })
        });

        const data = await res.json();

        if (res.ok && data.exito) {

          let horaRecepcionTexto = '';
          let minutosTranscurridos = null;

          if (data.fechaRecepcion) {
            const fechaRecepcion = new Date(data.fechaRecepcion);
            horaRecepcionTexto = fechaRecepcion.toLocaleString('es-AR', {
              hour: '2-digit',
              minute: '2-digit',
              second: '2-digit',
              day: '2-digit',
              month: '2-digit'
            });
            minutosTranscurridos = (Date.now() - fechaRecepcion.getTime()) / 60000;
          }

          const enlaceVencido = minutosTranscurridos !== null && minutosTranscurridos > 13;

          let html = `
            <div class="card-res ${enlaceVencido ? 'card-vencido' : 'card-exito'}">
              <p class="mensaje-exito">
                ¡Correo Encontrado! (${data.servicio || 'Servicio'})
              </p>
              <div style="font-size: 12px; margin-top: 6px; color: #aaa; word-break: break-word;">
                <strong>Asunto:</strong> ${data.asunto}
              </div>
          `;

          if (horaRecepcionTexto) {
            html += `
              <div class="hora-recepcion">
                🕒 Hora de recepción: ${horaRecepcionTexto}
              </div>
            `;
          }

          if (enlaceVencido) {

            html += `
              <p class="mensaje-vencido" style="margin-top:10px;">
                ⚠️️ Enlace vencido
              </p>
              <p style="color:#ccc; font-size:0.85rem; margin-top:4px;">
                Recibido hace más de 13 minutos. Solicita el reenvío.
              </p>
              <button
                id="btnReenviar"
                class="btn-reenviar"
                type="button"
              >
                Reenviar
              </button>
            `;

          } else if (data.enlace) {
            html += `
              <a
                href="${data.enlace}"
                target="_blank"
                class="btn-enlace-gigante"
              >
                🔗 ABRIR ENLACE DE VERIFICACIÓN
              </a>
            `;
          } else {
            html += `
              <p style="color:#ccc; margin-top:10px;">
                Se encontró el correo pero no contenía un enlace de verificación válido.
              </p>
            `;
          }

          html += `</div>`;

          contenedorResultado.innerHTML = html;

          if (enlaceVencido) {

            const textoReenvio =
`Hola, el enlace de verificación llegó hace más de 13 minutos y está vencido. Necesito que me reenvíen uno nuevo.
Correo: ${correoCliente}`;

            document
              .getElementById('btnReenviar')
              .addEventListener('click', () => {
                const url =
                  `https://api.whatsapp.com/send?phone=${TELEFONO_SOPORTE}&text=${encodeURIComponent(textoReenvio)}`;
                window.open(url, '_blank');
              });

          }

        } else {

          const mensajeError =
            data.error ||
            'No se encontró un correo válido para esta cuenta.';

          contenedorResultado.innerHTML = `

            <div class="card-res card-error">

              <p class="mensaje-error">
                ${mensajeError}
              </p>

              <button
                id="btnWS"
                class="btn-ws"
                type="button"
              >

                <svg
                  width="20"
                  height="20"
                  fill="currentColor"
                  viewBox="0 0 24 24"
                >
                  <path d="M.057 24l1.687-6.163c-1.041-1.804-1.588-3.849-1.587-5.946.003-6.556 5.338-11.891 11.893-11.891 3.181.001 6.167 1.24 8.413 3.488 2.245 2.248 3.481 5.236 3.48 8.414-.003 6.557-5.338 11.892-11.893 11.892-1.99-.001-3.951-.5-5.688-1.448l-6.305 1.654zm6.597-3.807c1.676.995 3.276 1.591 5.392 1.592 5.448 0 9.886-4.434 9.889-9.885.002-5.462-4.415-9.89-9.881-9.892-5.452 0-9.887 4.434-9.889 9.884-.001 2.225.651 3.891 1.746 5.634l-.999 3.648 3.842-1.001z"/>
                </svg>

                Contactar con Administrador

              </button>

              <div class="card-advertencia">
                <div class="card-advertencia-titulo">
                  ⚠️ Importante
                </div>
                Solo se recibirán reclamos que provengan de esta página, acompañados obligatoriamente de la foto de la pantalla del televisor del cliente que demuestre el envío del mail.
              </div>

            </div>
          `;

          document
            .getElementById('btnWS')
            .addEventListener('click', () => {
              const url = `https://api.whatsapp.com/send?phone=${TELEFONO_SOPORTE}`;
              window.open(url, '_blank');
            });

        }

      } catch (err) {

        contenedorResultado.innerHTML = `

          <div class="card-res card-error">

            <p class="mensaje-error">
              Error de conexión con el servidor.
            </p>

            <p class="texto-ayuda">
              Intenta nuevamente en unos segundos.
            </p>

          </div>

        `;

      } finally {

        btnBuscar.disabled = false;
        btnBuscar.textContent = 'Buscar Enlace';

      }

    });

  </script>

</body>
</html>
